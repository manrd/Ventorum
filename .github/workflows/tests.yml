# Author: Manuel Alejandro Rodriguez Diaz, PhD
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          # One Python version per extra OS keeps the CI time low. The
          # compiled kernels depend on the OS and compiler, not on Python.
          # macOS is not in the matrix: macOS problems are recorded and
          # handled after the general development (AGENTS.md, issue
          # manrd/Ventorum#1). The macOS branches of the steps below stay.
          # To test macOS again, add: {os: macos-latest, python-version: "3.12"}.
          # For a single check, start the hand-started workflow macos-debug.yml.
          - os: windows-latest
            python-version: "3.12"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ "$RUNNER_OS" = "macOS" ]; then
            # The macOS wheels of PyTorch on PyPI are CPU builds.
            python -m pip install torch
          else
            # CPU build of PyTorch: the CI runners have no GPU, and the CUDA wheels are large.
            python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          fi
          python -m pip install -e ".[dev,docs]"
      - name: Compiled kernels are present
        # The Cython extension is optional for users, but CI must build it on
        # every OS. Otherwise its tests skip and a build failure stays hidden.
        run: |
          python -c "from ventorum.aero import vortex_cython; from ventorum.legacy.aero import cython_kernels"
          # Without OpenMP the kernels are correct but run in one thread, and
          # the tests still pass. This check makes that case fail.
          if [ "$RUNNER_OS" = "macOS" ]; then
            # macOS builds without OpenMP on purpose (PyTorch has its own
            # libomp; see docs/user/performance_limits.md).
            python -c "from ventorum.aero import vortex_cython as c; assert not c.openmp_enabled(), 'unexpected OpenMP build'"
            echo "The Cython kernels are compiled without OpenMP (Python threads)."
          else
            python -c "from ventorum.aero import vortex_cython as c; assert c.openmp_enabled(), 'built without OpenMP'"
            echo "The Cython kernels are compiled with OpenMP."
          fi
      - name: Lint
        if: runner.os == 'Linux'
        run: ruff check .
      - name: Documentation (warnings are errors)
        if: runner.os == 'Linux'
        env:
          MPLBACKEND: Agg
        run: sphinx-build -W --keep-going -b html docs docs/_build/html
      - name: OpenMP and PyTorch in one process
        # Runs before the full test suite: a crash there stops the run with
        # no message, and this test shows the message.
        env:
          MPLBACKEND: Agg
        run: python -m pytest -q tests/test_kernels.py -k "pytorch or openmp"
      - name: Tests
        env:
          MPLBACKEND: Agg
          VENTORUM_REQUIRE_OPENMP: ${{ runner.os == 'macOS' && '0' || '1' }}
        run: python -m pytest -q
      - name: Verification report (theory checks)
        env:
          MPLBACKEND: Agg
        run: python validation/run_verification.py "$RUNNER_TEMP/verification_report.md"
      - name: Verification report matches the committed report
        # The committed report must match the code. The comparison ignores
        # the run time and the environment line.
        run: python validation/compare_reports.py docs/verification_report.md "$RUNNER_TEMP/verification_report.md"
      - name: Verification report with the Numba kernels
        env:
          MPLBACKEND: Agg
          VENTORUM_KERNEL: numba
        run: python validation/run_verification.py "$RUNNER_TEMP/verification_report_numba.md"
      - name: Numba verification report matches the committed report
        # The Numba backend must give the same physics as the default
        # backend (round-off only). The comparison ignores the run time
        # and the environment line.
        run: python validation/compare_reports.py docs/verification_report.md "$RUNNER_TEMP/verification_report_numba.md"
      - name: Examples (smoke run)
        env:
          MPLBACKEND: Agg
        run: |
          for f in examples/[0-9]*.py; do
            echo "::group::$f"
            python "$f"
            echo "::endgroup::"
          done
